<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Your Name</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Your Name</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="portfolio.html" class="active">Portfolio</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <main class="container portfolio-container">
        <section class="portfolio-header">
            <h1>My Portfolio</h1>
            <div class="portfolio-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="web">Web Development</button>
                <button class="filter-btn" data-filter="design">Design</button>
                <button class="filter-btn" data-filter="other">Other</button>
            </div>
        </section>

        <section class="portfolio-grid">
            <!-- Project 1 -->
            <div class="portfolio-item" data-category="web">
                <div class="portfolio-item-inner">
                    <img src="images/project-placeholder-1.jpg" alt="Project 1">
                    <div class="portfolio-overlay">
                        <h3>Project Name 1</h3>
                        <p>Web Development</p>
                        <div class="portfolio-links">
                            <a href="#" target="_blank"><i class="fas fa-link"></i></a>
                            <a href="#" target="_blank"><i class="fab fa-github"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Project 2 -->
            <div class="portfolio-item" data-category="design">
                <div class="portfolio-item-inner">
                    <img src="images/project-placeholder-2.jpg" alt="Project 2">
                    <div class="portfolio-overlay">
                        <h3>Project Name 2</h3>
                        <p>Design</p>
                        <div class="portfolio-links">
                            <a href="#" target="_blank"><i class="fas fa-link"></i></a>
                            <a href="#" target="_blank"><i class="fab fa-github"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Project 3 -->
            <div class="portfolio-item" data-category="other">
                <div class="portfolio-item-inner">
                    <img src="images/project-placeholder-3.jpg" alt="Project 3">
                    <div class="portfolio-overlay">
                        <h3>Project Name 3</h3>
                        <p>Other</p>
                        <div class="portfolio-links">
                            <a href="#" target="_blank"><i class="fas fa-link"></i></a>
                            <a href="#" target="_blank"><i class="fab fa-github"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Your Name. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>

</html>
